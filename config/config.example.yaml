# tradebot configuration
#
#   cp config/config.example.yaml config/config.yaml
#
# config/config.yaml is gitignored. The example below works as-is for paper
# trading: `tradebot --dry-run` needs no credentials at all.

# ซึ่งตลาด: grvt | hyperliquid
# ค่า default ของ symbol และสเปคสินค้าจะเปลี่ยนตามตลาดที่เลือกให้เอง
exchange: "grvt"

grvt:
  # "testnet" หรือ "prod" — prod ต้องใส่ --live ด้วยถึงจะยิงออเดอร์
  env: "testnet"

  # ออกกุญแจที่หน้า API ของ GRVT แล้วเปิดสิทธิ์เทรดอย่างเดียว ปิดสิทธิ์ถอนเงิน
  # เว้นว่างไว้ได้ถ้าจะเทรดกระดาษ (--dry-run)
  # ถ้าไม่อยากเก็บค่าไว้ในไฟล์ ให้เขียน ${GRVT_API_KEY} แล้ว export ใน shell แทน
  api_key: ""
  private_key: ""
  trading_account_id: ""
  sub_account_id: "0"

hyperliquid:
  # "testnet" หรือ "mainnet" — mainnet ต้องใส่ --live
  network: "testnet"

  # สองค่านี้คนละหน้าที่ อย่าสลับกัน
  #   account_address  บัญชีแม่ (0x + 40 ตัว) ใช้ query ยอดเงินและ position
  #   api_wallet_key   private key ของ API wallet ใช้เซ็นอย่างเดียว ถอนเงินไม่ได้
  # สร้าง API wallet ที่ https://app.hyperliquid.xyz/API
  # ⚠️ faucet ของ testnet จ่าย mock USDC ให้เฉพาะ wallet ที่เคย deposit บน mainnet
  account_address: ""
  api_wallet_key: ""
  vault_address: ""

trading:
  # เว้นว่าง = ใช้ค่าเริ่มต้นของตลาดที่เลือก
  #   grvt         BTC_USDT_Perp   (ชื่อเป็นคู่เทรด)
  #   hyperliquid  BTC             (ชื่อเป็นเหรียญเปล่า)
  symbol: ""

  # แท่งเทียนที่ใช้ warm-up ตอนเริ่ม
  # 1m 3m 5m 15m 30m 1h 2h 4h 8h 12h 1d 3d 1w
  timeframe: "5m"

  loop_interval: 60          # วินาทีต่อรอบ ตอนทดลองลดเป็น 5
  strategy: "random"         # ดูตัวเลือกด้วย tradebot --list-strategies
  warmup_candles: 200        # แท่งจริงที่โหลดมาก่อนตัดสินใจรอบแรก

risk:
  # เขียนเป็นเปอร์เซ็นต์แบบที่คนพูดกัน (1.0 คือ 1%)
  risk_per_trade_pct: 1.0    # เสียเท่านี้ของพอร์ตถ้าโดน stop
  max_positions: 1
  max_daily_loss_pct: 3.0    # พอร์ตลดจากต้นวัน (UTC) เท่านี้ → หยุดบอท
  max_drawdown_pct: 10.0     # พอร์ตลดจากจุดสูงสุดเท่านี้ → หยุดบอท
  max_leverage: 5            # เพดาน exposure = ทุน × ค่านี้
  max_slippage_pct: 0.1      # และกลายเป็น limit price ของทุกออเดอร์
  fee_rate_pct: 0.05         # ค่าธรรมเนียมต่อขา ใช้ตอนคำนวณขนาดไม้
  allow_short: true
  starting_equity_usdt: 10000  # เทรดกระดาษเท่านั้น ของจริงอ่านจากบัญชี

# เว้นทั้งบล็อกไว้ = ใช้ค่าของตลาดที่เลือก แล้วค่อยให้ตลาดจริงบอกตอนต่อ
# ใส่ทับได้ทีละช่อง เช่นใส่แค่ tick_size ช่องอื่นยังมาจากค่าเริ่มต้น
instrument: {}
