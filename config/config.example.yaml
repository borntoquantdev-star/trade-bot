# hyperbot configuration
#
#   cp config/config.example.yaml config/config.yaml
#
# config/config.yaml is gitignored. The example below works as-is for paper
# trading: `hyperbot --dry-run` needs no credentials at all.

hyperliquid:
  # "testnet" or "mainnet". Running mainnet also requires the --live flag.
  network: "testnet"

  # Hyperliquid has TWO identities and mixing them up is the classic mistake.
  #
  #   account_address  the MASTER account, a 42-character 0x address.
  #                    Positions and equity are looked up by this address.
  #                    Query with the API wallet address instead and the
  #                    exchange returns an empty state, with no error.
  #
  #   api_wallet_key   the PRIVATE KEY of an API wallet (an "agent") that the
  #                    master account has approved. It only signs orders.
  #                    Create one at https://app.hyperliquid.xyz/API
  #
  # Leave both empty to paper trade. To keep the key out of the file, write
  # a ${VARIABLE} reference and export it in your shell instead:
  #     api_wallet_key: "${HYPERLIQUID_API_WALLET_KEY}"
  # A ${VARIABLE} that is not set in the shell is an error, on purpose.
  account_address: ""
  api_wallet_key: ""

  # Optional: trade on behalf of a vault rather than the account itself.
  vault_address: ""

trading:
  # Hyperliquid perps are named by coin, not by pair: BTC, ETH, SOL, ...
  symbol: "BTC"

  # Candle interval used to warm the strategy up at start-up.
  # One of: 1m 3m 5m 15m 30m 1h 2h 4h 8h 12h 1d 3d 1w 1M
  timeframe: "5m"

  loop_interval: 60          # seconds between iterations; lower while testing
  strategy: "random"         # see: hyperbot --list-strategies
  warmup_candles: 200        # real bars loaded before the first decision

risk:
  # Percentages are written the way a human says them: 1.0 means 1%.
  risk_per_trade_pct: 1.0    # of equity, lost if the stop is hit
  max_positions: 1           # concurrent open positions
  max_daily_loss_pct: 3.0    # equity drop since 00:00 UTC that halts the bot
  max_drawdown_pct: 10.0     # drop from peak equity that halts the bot
  max_leverage: 5            # exposure ceiling = equity x this
  max_slippage_pct: 0.1      # also becomes the limit price on every order
  fee_rate_pct: 0.045        # taker fee per leg, included when sizing
  allow_short: true
  starting_equity_usdt: 10000  # paper trading only; live reads the account

instrument:
  # Fallbacks for paper trading. A live session reads the real values from the
  # exchange's perp metadata, where szDecimals drives both precisions.
  #
  # BTC has szDecimals 5, so:
  #   lot_step  = 10^-5
  #   tick_size = 10^-(6 - 5) = 0.1   (perps allow 6 - szDecimals decimals)
  #
  # Prices additionally carry at most 5 significant figures, except that whole
  # numbers are always accepted. Both rules are enforced together.
  tick_size: 0.1
  lot_step: 0.00001
  min_notional_usdt: 10      # the exchange answers "minimum value of $10"
  max_leverage: 40
  price_sig_figs: 5
