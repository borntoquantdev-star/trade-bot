<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tradebot — canvas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- แถบบน -->
<header class="top">
  <div class="brand"><span class="mark">hb</span><b>tradebot</b></div>
  <div class="tabs"><button class="tab on" id="tabName">live</button></div>
  <span class="spacer"></span>
  <span class="pill" id="pillSymbol">—</span>
  <span class="pill" id="pillMode"><i class="dot"></i><span>paper</span></span>
  <span class="pill" id="pillLive"><i class="dot"></i><span>กำลังต่อ</span></span>
</header>

<!-- แถบเครื่องมือซ้าย -->
<nav class="rail" aria-label="เครื่องมือ">
  <button class="tool on" id="toolSelect" title="เลื่อน/เลือก (ลากพื้นที่ว่างเพื่อเลื่อน)">✛</button>
  <button class="tool" id="toolFit" title="จัดให้พอดีจอ (F)">⤢</button>
  <button class="tool" id="toolReset" title="คืนตำแหน่งการ์ดเป็นค่าเริ่มต้น">⟲</button>
  <button class="tool" id="toolWires" title="ซ่อน/แสดงเส้นต่อ (W)">∿</button>
  <button class="tool" id="toolPause" title="หยุด/เล่นการอัปเดต (space)">⏸</button>
</nav>

<!-- แบนเนอร์หยุด -->
<div class="halt" id="halt" hidden>
  <b>บอทหยุดตัวเองแล้ว</b> — <span id="haltReason"></span>
  <div class="halt-sub">อ่านเหตุผลให้เข้าใจก่อน แล้วค่อยปลดด้วย <code>tradebot --resume</code></div>
</div>

<p class="canvas-hint">ลากพื้นที่ว่างเพื่อเลื่อน · ลากหัวการ์ดเพื่อย้าย · ล้อเมาส์เพื่อซูม</p>

<!-- แคนวาส -->
<main class="canvas" id="canvas">
  <div class="layer" id="layer">
    <svg class="wires" id="wires" aria-hidden="true"></svg>
    <div class="group" id="group"><span class="group-label" id="groupLabel">PIPELINE · สายการทำงานของบอท</span></div>
    <div id="nodes"></div>
  </div>
</main>

<!-- มุมขวาล่าง: มินิแมป + ซูม -->
<div class="minimap" id="minimap"><svg id="minimapSvg" viewBox="0 0 160 100"></svg></div>
<div class="zoombar">
  <button id="zoomOut" title="ซูมออก">−</button>
  <span id="zoomLevel">100%</span>
  <button id="zoomIn" title="ซูมเข้า">+</button>
  <button id="zoomFit" title="พอดีจอ">Fit</button>
</div>

<!-- แถบล่าง -->
<footer class="status">
  <span id="statusLeft">กำลังต่อ...</span>
  <span class="spacer"></span>
  <span class="warn-note">อ่านอย่างเดียว · สั่งอะไรบอทไม่ได้จากหน้านี้</span>
</footer>

<script src="lib/pipeline.js"></script>
<script src="app.js"></script>
</body>
</html>
